<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IPL Auction Simulator</title>
<meta name="description" content="Coach across the IPL, PSL, SA20 and The Hundred: auctions, trades, seasons and a career that can take you anywhere, or run one IPL auction.">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app"><p style="padding:32px 0;color:#8b94a7">Loading the auction room…</p></div>
<script type="module" src="js/ui/app.js"></script>
<script>
// Vercel Web Analytics and Speed Insights. The scripts only exist on Vercel, so skip them locally and on GitHub Pages.
if (!/^(localhost|127\.0\.0\.1)$|\.github\.io$/.test(location.hostname)) {
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  for (const src of ['/_vercel/insights/script.js', '/_vercel/speed-insights/script.js']) {
    const s = document.createElement('script'); s.defer = true; s.src = src; document.body.appendChild(s);
  }
}
</script>
</body>
</html>
